name: CI
on: 
    push:
        branches: [main]
env:
    ACR_LOGIN_SERVER: m324demoacrqba.azurecr.io

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Install Node.js dependencies
              run: npm ci
            
            - name: Run ESLint
              run: npm run lint
