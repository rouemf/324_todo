apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-nro-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-nro
  template:
    metadata:
      labels:
        app: todo-nro
    spec:
      imagePullSecrets:
        - name: acr-pull
      containers:
        - name: todo-nro
          image: m324demoacrqba.azurecr.io/324_todo_nro:9c21aca
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: todo-nro-service
spec:
  type: ClusterIP
  selector:
    app: todo-nro
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-nro-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: todo-nro.89.145.167.242.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todo-nro-service
                port:
                  number: 80